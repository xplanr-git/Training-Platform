name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so `next build` / tests never hit a missing-var throw.
  # Real secrets are injected in the deploy pipeline, not here.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000

jobs:
  db:
    name: db (schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: db/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Validate migration consistency
        run: npm run check
      - name: Typecheck
        run: npx tsc --noEmit

  web:
    name: web (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web depends on ../db (file: link); its deps (drizzle-orm) must be
      # installed so the typecheck/build can resolve types through the link.
      - name: Install db workspace deps
        working-directory: db
        run: npm ci
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: web (e2e smoke)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install db workspace deps
        working-directory: db
        run: npm ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run e2e

  # The four REAL journeys — golden-path, quiz-path, overview-stats,
  # signup-provision — plus the RLS attack probes. They authenticate and WRITE,
  # so they run against a disposable Supabase project, never production.
  #
  # Every spec self-skips unless ALLOW_LIVE_WRITES=1, and the probes additionally
  # refuse to run if their target matches the app's own project. So with no
  # secrets configured this job passes with everything skipped — which is the
  # honest state until the disposable project exists, and is visible in the run
  # log rather than silently absent. Populate the secrets below to switch it on.
  live:
    name: web (live journeys)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    env:
      ALLOW_LIVE_WRITES: ${{ secrets.ALLOW_LIVE_WRITES }}
      LIVE_BASE_URL: ${{ secrets.LIVE_BASE_URL }}
      DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
      DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
      RLS_PROBE_SUPABASE_URL: ${{ secrets.RLS_PROBE_SUPABASE_URL }}
      RLS_PROBE_ANON_KEY: ${{ secrets.RLS_PROBE_ANON_KEY }}
      RLS_PROBE_LEARNER_EMAIL: ${{ secrets.RLS_PROBE_LEARNER_EMAIL }}
      RLS_PROBE_LEARNER_PASSWORD: ${{ secrets.RLS_PROBE_LEARNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install db workspace deps
        working-directory: db
        run: npm ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Live journeys
        run: npm run test:live
